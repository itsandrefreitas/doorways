allprojects {
    group = mod_group
    version = mod_version
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as Integer)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as Integer
    }

    repositories {
        mavenCentral()
    }
}
