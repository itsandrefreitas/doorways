# Doorways for Minecraft 26.2.
#
# Only what differs between game versions belongs here. Everything shared -- the mod's own
# version, the Java release, the Gradle plugins -- stays in gradle.properties, so that a value
# common to both versions cannot drift apart between two files.
#
# Verified against the official sources, as D-01 requires: the Fabric meta API for the loader,
# Modrinth for Fabric API, and the NeoForged maven for NeoForge. Do not change these by
# guesswork.

minecraft_version=26.2
minecraft_version_range=[26.2,26.3)

# 0.19.3 rather than the newest loader: this is the floor the released 26.2 jars declare, and
# raising it would force everyone already running the mod to update their loader for nothing.
fabric_loader_version=0.19.3
fabric_api_version=0.158.0+26.2

neoforge_version=26.2.0.70
