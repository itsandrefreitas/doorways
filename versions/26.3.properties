# Doorways for Minecraft 26.3.
#
# Only what differs between game versions belongs here. See 26.2.properties for the rule.

minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# 0.19.5 is the floor: it is the first stable loader Fabric published for 26.3, and the one
# their release notes tell players to install.
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge for 26.3 is still in beta -- 26.3.0.31-beta is what `<release>` in their maven
# points at, so it is also the only build a player on 26.3 can install. Shipping against it is
# the same choice every other mod on this version is making.
neoforge_version=26.3.0.31-beta
