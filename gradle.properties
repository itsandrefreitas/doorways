# Doorways - what is the same for every Minecraft version this tree builds for.
# What differs is in versions/<version>.properties.
#
# Versions verified against official sources (see DECISIONS.md, D-01). Do NOT
# change these by guesswork: every value was confirmed against the official MDK
# or template.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Disabled for IntelliJ compatibility, as in the official Fabric template.
org.gradle.configuration-cache=false

# --- Mod -------------------------------------------------------------------
mod_id=doorways
mod_name=Doorways
mod_version=0.6.0
mod_group=com.doorways
mod_license=MIT
# Gradle reads .properties as ISO-8859-1 (the Java Properties format), so any
# non-ASCII character has to be escaped or it reaches the jar metadata mangled.
mod_authors=Andr\u00e9 Freitas
mod_description=Articulated doors 1 to 4 blocks wide and 2 or 3 blocks tall.

# --- Minecraft -------------------------------------------------------------
# The game versions this one source tree builds for, newest first; the first is the default.
# Everything that differs between them lives in versions/<version>.properties. Build another
# with -Pmc=26.2. The tools read this same line, so the list exists in exactly one place.
minecraft_targets=26.3,26.2
# Both 26.2 and 26.3 ship Java 25 to players; mods must target Java 25.
java_version=25

# --- Fabric ----------------------------------------------------------------
# Loom 1.17 covers both 26.2 and 26.3.
loom_version=1.17-SNAPSHOT

# --- NeoForge --------------------------------------------------------------
# 2.0.144 could not build 26.3: its bundled NeoForm Runtime is 2.0.24, and the
# recompile step -- where NFRT compiles the patched Minecraft sources -- failed
# on a game version newer than itself. 2.0.147 carries a current NFRT.
moddevgradle_version=2.0.147

# --- Tests ----------------------------------------------------------------
junit_version=5.12.2
