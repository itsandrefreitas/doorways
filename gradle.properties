# Doorways - versions verified against official sources (see DECISIONS.md, D-01).
# Do NOT change these by guesswork: every value below was confirmed against the
# official MDK or template.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Disabled for IntelliJ compatibility, as in the official Fabric template.
org.gradle.configuration-cache=false

# --- Mod -------------------------------------------------------------------
mod_id=doorways
mod_name=Doorways
mod_version=0.1.0
mod_group=com.doorways
mod_license=MIT
# Gradle reads .properties as ISO-8859-1 (the Java Properties format), so any
# non-ASCII character has to be escaped or it reaches the jar metadata mangled.
mod_authors=Andr\u00e9 Freitas
mod_description=Articulated doors 1, 2, 3 and 4 blocks wide and 2 blocks tall.

# --- Minecraft -------------------------------------------------------------
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
# 26.2 ships Java 25 to players; mods must target Java 25.
java_version=25

# --- Fabric ----------------------------------------------------------------
loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.158.0+26.2

# --- NeoForge --------------------------------------------------------------
moddevgradle_version=2.0.144
neoforge_version=26.2.0.70

# --- Tests ----------------------------------------------------------------
junit_version=5.12.2
