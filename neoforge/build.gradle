plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge"
}

// The same share-by-source arrangement as the fabric module.
sourceSets.main.java.srcDirs += [
        project(':core').file('src/main/java'),
        project(':common').file('src/main/java'),
]
sourceSets.main.resources.srcDirs += [
        project(':common').file('src/main/resources'),
]

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// The NeoForm tools (decompile, apply patches, download assets) ask for Java 21 by default,
// and this project only requires 25 -- which is what Minecraft 26.2 mandates. Rather than
// requiring two JDKs to be installed, NFRT is pointed at the project toolchain: it is an
// ordinary Java tool and runs fine on 25.
def projectLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(java_version as Integer)
}
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable.set(projectLauncher.map { it.executablePath.asFile.absolutePath })
}

// ModDevGradle expands src/main/templates instead of filtering the resources directly.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
            version                : project.version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
